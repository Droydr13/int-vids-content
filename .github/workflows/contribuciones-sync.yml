name: Sync vids.st contribuciones

on:
  push:
    paths:
      - 'contribuciones.html'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resolver el link nuevo 
        run: curl -sf "https://vids-scrapp.onrender.com/sync?secret=${{ secrets.RESOLVE_SECRET }}&fuente=contribuciones"

      - name: Avisarle al addon 
        run: curl -sf "https://addonlatam.duckdns.org/admin/refresh-vids-contrib?secret=${{ secrets.M3U_REFRESH_SECRET }}"
