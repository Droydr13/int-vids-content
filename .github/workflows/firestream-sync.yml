name: Sync firestream pendientes

on:
  push:
    paths:
      - 'pendientes-firestream.html'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resolver el link nuevo
        run: curl -sf "https://vids-scrapp.onrender.com/sync?secret=${{ secrets.RESOLVE_SECRET }}&fuente=firestream"

      - name: Avisarle al addon
        run: curl -sf "https://addonlatam.duckdns.org/admin/refresh-firestream-manual?secret=${{ secrets.M3U_REFRESH_SECRET }}"
